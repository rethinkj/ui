# The native libraries this module packages, pinned by version and by the SHA-256 of the archive
# they come from. wgpu-native comes from its release archive. SDL publishes no Linux binaries, so it
# is built from its source archive.
#
# scripts/FetchNatives.java reads this file. It downloads each archive into fetched/archives/ and
# checks its SHA-256. It builds a library that has a .cmake line in fetched/builds/<name>/, once,
# and unpacks the others. It puts the libraries into
# fetched/resources/META-INF/rethinkj-ui/natives/<platform>/ and writes manifest.txt beside them.
# The module's build runs it, and it does nothing while fetched/ matches this file.
#
# Building SDL needs cmake, make, a C compiler, pkg-config and the development files of X11,
# Wayland, xkbcommon, EGL and D-Bus. On Debian and Ubuntu:
#   sudo apt install build-essential cmake pkg-config libx11-dev libxext-dev libxrandr-dev \
#     libxcursor-dev libxfixes-dev libxi-dev libxtst-dev libwayland-dev libxkbcommon-dev \
#     libegl-dev libdbus-1-dev
# Where libibus-1.0-dev and libdecor-0-dev are installed too, SDL also supports IBus and draws
# window decorations on Wayland compositors that leave them to the application.
#
# To change a version, edit the library's lines, build, and update the licence texts under
# src/main/resources if the release changed them.

platform = linux-x64

# Load order: a library comes after the libraries it needs.
libraries = sdl3 wgpu_native

sdl3.version = 3.4.20
sdl3.archive = https://github.com/libsdl-org/SDL/releases/download/release-3.4.20/SDL3-3.4.20.zip
sdl3.archive.sha256 = 9850235fa6c9e99631dbe6f30dd620e4fba2e9c879b551a8c479e505e9e3f617
# The archive holds the source, built with these cmake options. SDL makes windows and reads input;
# wgpu draws. So SDL's GPU API, renderer, OpenGL and Vulkan support are off, as are audio, camera,
# joysticks, sensors and the console video driver (KMSDRM). The build fails if cmake turns off an
# option set ON here. XScreenSaver is off: SDL uses it only to hold off the screen saver, and its
# development files are often missing.
sdl3.cmake = -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF \
    -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_EXAMPLES=OFF -DSDL_INSTALL=OFF \
    -DSDL_VIDEO=ON -DSDL_X11=ON -DSDL_WAYLAND=ON -DSDL_DBUS=ON -DSDL_X11_XSCRNSAVER=OFF \
    -DSDL_KMSDRM=OFF -DSDL_GPU=OFF -DSDL_RENDER=OFF -DSDL_OPENGL=OFF -DSDL_OPENGLES=OFF \
    -DSDL_VULKAN=OFF -DSDL_AUDIO=OFF -DSDL_PIPEWIRE=OFF -DSDL_CAMERA=OFF -DSDL_JOYSTICK=OFF \
    -DSDL_HAPTIC=OFF -DSDL_HIDAPI=OFF -DSDL_SENSOR=OFF -DSDL_POWER=OFF -DSDL_LIBUDEV=OFF \
    -DSDL_LIBURING=OFF
# The library's path in the build folder. The module packages a library under its file name, which
# for a Linux library must be its SONAME, so that a library that needs it finds the loaded copy.
sdl3.entry = libSDL3.so.0

wgpu_native.version = 29.0.1.1
wgpu_native.archive = https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-linux-x86_64-release.zip
wgpu_native.archive.sha256 = 95a4d90c071005a98d03eab348beaa6b07e16eb00d1dcdb9f8348f75eb97ec5a
# Has no SONAME.
wgpu_native.entry = lib/libwgpu_native.so

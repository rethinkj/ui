# The native libraries this module packages, pinned by version and by the SHA-256 of the archive
# they come from. wgpu-native comes from its release archive. The others are built from their
# source archives: SDL publishes no Linux binaries, and the FreeType and HarfBuzz that systems have
# bring dependencies that these builds leave out.
#
# scripts/FetchNatives.java reads this file. It downloads each archive into fetched/archives/ and
# checks its SHA-256. It builds a library that has a .cmake line in fetched/builds/<name>/, once,
# and unpacks the others. It puts the libraries into
# fetched/resources/META-INF/rethinkj-ui/natives/<platform>/ and writes manifest.txt beside them.
# The module's build runs it, and it does nothing while fetched/ matches this file.
#
# Building needs cmake, make, a C and a C++ compiler, pkg-config, tar and xz, and for SDL the
# development files of X11, Wayland, xkbcommon, EGL and D-Bus. On Debian and Ubuntu:
#   sudo apt install build-essential cmake pkg-config xz-utils libx11-dev libxext-dev \
#     libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxtst-dev libwayland-dev \
#     libxkbcommon-dev libegl-dev libdbus-1-dev
# Where libibus-1.0-dev and libdecor-0-dev are installed too, SDL also supports IBus and draws
# window decorations on Wayland compositors that leave them to the application.
#
# To change a version, edit the library's lines, build, and update the licence texts under
# src/main/resources if the release changed them.

platform = linux-x64

# Load order: a library comes after the libraries it needs. Loading one loads those before it, so
# the text libraries come first: rendering without a window needs them, but not SDL or wgpu.
libraries = freetype harfbuzz sdl3 wgpu_native

# From the FreeType project's release folder. The archive is signed (freetype-2.15.0.tar.xz.sig
# beside it) with the key E306 7470 7856 409F F194 8010 BE6C 3AAC 63AD 8E3F of Werner Lemberg, who
# signs the FreeType releases.
freetype.version = 2.15.0
freetype.archive = https://download.savannah.gnu.org/releases/freetype/freetype-2.15.0.tar.xz
freetype.archive.sha256 = 93cd47eb719c325107f2d3cf087d06299e944c3b48a40b55537302304dea1dd5
# No zlib, bzip2, libpng, brotli or HarfBuzz from the system: FreeType uses its own copy of zlib for
# WOFF and compressed PCF fonts, and goes without bzip2-compressed fonts, PNG bitmaps in color
# fonts, WOFF2 and HarfBuzz's help for the auto-hinter. Everything else is FreeType's default, the
# auto-hinter and the TrueType bytecode interpreter included.
freetype.cmake = -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DFT_DISABLE_ZLIB=ON \
    -DFT_DISABLE_BZIP2=ON -DFT_DISABLE_PNG=ON -DFT_DISABLE_BROTLI=ON -DFT_DISABLE_HARFBUZZ=ON
freetype.entry = libfreetype.so.6

# From HarfBuzz's GitHub release; the SHA-256 is the digest GitHub shows for that file. HarfBuzz
# builds with Meson upstream; this uses its CMake build, which the community maintains, so that the
# build needs no Meson. Unlike Meson's, it does not look for newlocale and uselocale, so
# hb_language_get_default() gives "c" whatever the locale, and the numbers hb_variation_to_string()
# writes follow the process's LC_NUMERIC.
harfbuzz.version = 15.1.0
harfbuzz.archive = https://github.com/harfbuzz/harfbuzz/releases/download/15.1.0/harfbuzz-15.1.0.tar.xz
harfbuzz.archive.sha256 = 0fc7c565443a5f4be7da65ac5ee5bd737d9b158dc908708b7689a0a5796b0c8d
# Only the shaping library, with HarfBuzz's own OpenType and Unicode functions and nothing from
# outside the C runtime: no FreeType, GLib, ICU, Graphite, Cairo, no subset, raster, vector or GPU
# library and no tools. It is C++, but built without exceptions and RTTI and linked as C, so it does
# not need libstdc++.
harfbuzz.cmake = -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DHB_HAVE_FREETYPE=OFF \
    -DHB_HAVE_GLIB=OFF -DHB_HAVE_ICU=OFF -DHB_HAVE_GRAPHITE2=OFF -DHB_HAVE_CAIRO=OFF \
    -DHB_HAVE_GOBJECT=OFF -DHB_HAVE_INTROSPECTION=OFF -DHB_BUILD_UTILS=OFF -DHB_BUILD_SUBSET=OFF \
    -DHB_BUILD_RASTER=OFF -DHB_BUILD_VECTOR=OFF -DHB_BUILD_GPU=OFF
# The CMake build gives the library no version in its SONAME, unlike Meson's libharfbuzz.so.0.
harfbuzz.entry = libharfbuzz.so

sdl3.version = 3.4.20
sdl3.archive = https://github.com/libsdl-org/SDL/releases/download/release-3.4.20/SDL3-3.4.20.zip
sdl3.archive.sha256 = 9850235fa6c9e99631dbe6f30dd620e4fba2e9c879b551a8c479e505e9e3f617
# The archive holds the source, built with these cmake options. SDL makes windows and reads input;
# wgpu draws. So SDL's GPU API, renderer, OpenGL and Vulkan support are off, as are audio, camera,
# joysticks, sensors and the console video driver (KMSDRM). The build fails if cmake turns off an
# option set ON here. XScreenSaver is off: SDL uses it only to hold off the screen saver, and its
# development files are often missing.
sdl3.cmake = -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF \
    -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_EXAMPLES=OFF -DSDL_INSTALL=OFF \
    -DSDL_VIDEO=ON -DSDL_X11=ON -DSDL_WAYLAND=ON -DSDL_DBUS=ON -DSDL_X11_XSCRNSAVER=OFF \
    -DSDL_KMSDRM=OFF -DSDL_GPU=OFF -DSDL_RENDER=OFF -DSDL_OPENGL=OFF -DSDL_OPENGLES=OFF \
    -DSDL_VULKAN=OFF -DSDL_AUDIO=OFF -DSDL_PIPEWIRE=OFF -DSDL_CAMERA=OFF -DSDL_JOYSTICK=OFF \
    -DSDL_HAPTIC=OFF -DSDL_HIDAPI=OFF -DSDL_SENSOR=OFF -DSDL_POWER=OFF -DSDL_LIBUDEV=OFF \
    -DSDL_LIBURING=OFF
# The library's path in the build folder. The module packages a library under its file name, which
# for a Linux library must be its SONAME, so that a library that needs it finds the loaded copy.
sdl3.entry = libSDL3.so.0

wgpu_native.version = 29.0.1.1
wgpu_native.archive = https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-linux-x86_64-release.zip
wgpu_native.archive.sha256 = 95a4d90c071005a98d03eab348beaa6b07e16eb00d1dcdb9f8348f75eb97ec5a
# Has no SONAME.
wgpu_native.entry = lib/libwgpu_native.so

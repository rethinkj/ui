# The native libraries this module packages, pinned by version and by the SHA-256 of the archive
# they come from. SDL, wgpu-native and the DirectX Shader Compiler (DXC) come from their release
# archives. FreeType and HarfBuzz are built from the source archives that natives-linux-x64 builds,
# with its options, so that text has the same features on both platforms.
#
# scripts/FetchNatives.java reads this file. It downloads each archive into fetched/archives/ and
# checks its SHA-256. It builds any build-only dependencies into fetched/builds/prefix/, builds
# each packaged library that has a .cmake line in fetched/builds/<name>/, once, and unpacks the
# others. It puts the libraries into fetched/resources/META-INF/rethinkj-ui/natives/<platform>/
# and writes manifest.txt beside them. The module's build runs it, and it does nothing while
# fetched/ matches this file.
#
# Building needs Visual Studio 2022 or later, or its Build Tools, with the workload "Desktop
# development with C++" and its component "C++ CMake tools for Windows". The tool finds them with
# vswhere.exe and needs nothing on the PATH. Instead of that component, cmake may come from the
# PATH or from the file that the environment variable CMAKE names, such as bin\cmake.exe of the
# Windows ZIP from cmake.org, unpacked anywhere. The class WindowsTools in the tool has the
# details.
#
# To change a version, edit the library's lines, build, and update the license texts under
# src/main/resources if the release changed them.

platform = windows-x64

# Build-only static dependencies, built in order and installed into a shared prefix before the
# packaged libraries below; linked statically into FreeType with /MT so freetype.dll still needs
# nothing beyond KERNEL32.dll.
dependencies = zlib libpng

# Load order: a library comes after the libraries it needs. Loading one loads those before it, so
# the text libraries come first: rendering without a window needs them, but not SDL or wgpu.
# dxcompiler comes last, so that loading wgpu_native does not load it: core loads it only for a
# Direct3D 12 instance, to check it before it passes its path to wgpu-native.
libraries = freetype harfbuzz sdl3 wgpu_native dxcompiler

# The archives of zlib, libpng, FreeType and HarfBuzz are those of natives-linux-x64, which says
# where they come from. All of them link the C runtime statically (/MT), so that they need nothing
# but KERNEL32.dll; VCRUNTIME140.dll comes with the Visual C++ Redistributable, not with Windows.
# The DLLs are linked with -Brepro, so that the linker writes no time stamps into them and every
# build of the same sources with the same Visual Studio gives the same bytes. A new checkout then
# reuses the libraries an earlier one unpacked, and Microsoft Defender knows them: on first load
# of a DLL it has not seen, it can hold LoadLibrary for several seconds while its cloud service
# checks the file.
zlib.version = 1.4
zlib.archive = https://github.com/madler/zlib/releases/download/v1.4/zlib-1.4.tar.xz
zlib.archive.sha256 = 4f11c512053d7bab8d9e9b89bde3575add3e4c50a383b42ef6cb837035fc5a7c
zlib.cmake = -DCMAKE_BUILD_TYPE=Release -DZLIB_BUILD_SHARED=OFF -DZLIB_BUILD_STATIC=ON \
    -DZLIB_BUILD_TESTING=OFF -DZLIB_INSTALL=ON -DCMAKE_INSTALL_LIBDIR=lib \
    -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

libpng.version = 1.6.59
libpng.archive = https://downloads.sourceforge.net/project/libpng/libpng16/1.6.59/libpng-1.6.59.tar.xz
libpng.archive.sha256 = d80dd2a38a37f803cb9b6ac7b14bd6e74ddc3b654780a8380bdf93523fdb4389
libpng.cmake = -DCMAKE_BUILD_TYPE=Release -DPNG_SHARED=OFF -DPNG_STATIC=ON -DPNG_TESTS=OFF \
    -DPNG_TOOLS=OFF -DZLIB_USE_STATIC_LIBS=ON -DCMAKE_FIND_USE_PACKAGE_ROOT_PATH=OFF \
    -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
    -DCMAKE_POLICY_DEFAULT_CMP0091=NEW

freetype.version = 2.15.0
freetype.archive = https://download.savannah.gnu.org/releases/freetype/freetype-2.15.0.tar.xz
freetype.archive.sha256 = 93cd47eb719c325107f2d3cf087d06299e944c3b48a40b55537302304dea1dd5
# The options of natives-linux-x64: static zlib and libpng from the prefix for CBDT color emoji,
# no bzip2, brotli or HarfBuzz, the auto-hinter and the TrueType bytecode interpreter in. A Release
# build, whose DLL has no d suffix.
freetype.cmake = -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DFT_REQUIRE_ZLIB=ON \
    -DFT_DISABLE_BZIP2=ON -DFT_REQUIRE_PNG=ON -DFT_DISABLE_BROTLI=ON -DFT_DISABLE_HARFBUZZ=ON \
    -DZLIB_USE_STATIC_LIBS=ON -DCMAKE_FIND_USE_PACKAGE_ROOT_PATH=OFF \
    -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_SHARED_LINKER_FLAGS=-Brepro
# The library's path in the build folder, or inside the release archive; the module packages it
# under its file name.
freetype.entry = freetype.dll

harfbuzz.version = 15.2.0
harfbuzz.archive = https://github.com/harfbuzz/harfbuzz/releases/download/15.2.0/harfbuzz-15.2.0.tar.xz
harfbuzz.archive.sha256 = e2ec49090744383cdbe7df808c1cedaafba06a97be8dc4211fe546ba585f12cb
# The options of natives-linux-x64, and without Windows' own shaping and font APIs (Uniscribe, GDI,
# DirectWrite), which are off by default too. HarfBuzz asks for CMake 3.14, which leaves the policy
# CMP0091 OLD, and then CMAKE_MSVC_RUNTIME_LIBRARY has no effect; so the policy is set NEW here.
# FreeType's CMake range makes it NEW by itself.
harfbuzz.cmake = -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DHB_HAVE_FREETYPE=OFF \
    -DHB_HAVE_GLIB=OFF -DHB_HAVE_ICU=OFF -DHB_HAVE_GRAPHITE2=OFF -DHB_HAVE_CAIRO=OFF \
    -DHB_HAVE_GOBJECT=OFF -DHB_HAVE_INTROSPECTION=OFF -DHB_BUILD_UTILS=OFF -DHB_BUILD_SUBSET=OFF \
    -DHB_BUILD_RASTER=OFF -DHB_BUILD_VECTOR=OFF -DHB_BUILD_GPU=OFF -DHB_HAVE_UNISCRIBE=OFF \
    -DHB_HAVE_GDI=OFF -DHB_HAVE_DIRECTWRITE=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
    -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_SHARED_LINKER_FLAGS=-Brepro
harfbuzz.entry = harfbuzz.dll

sdl3.version = 3.4.20
sdl3.archive = https://github.com/libsdl-org/SDL/releases/download/release-3.4.20/SDL3-3.4.20-win32-x64.zip
sdl3.archive.sha256 = 368bed8b24e44ad9ea372990814f2343fcfb9e468abb7f8f4a3bc146c7304752
sdl3.entry = SDL3.dll

wgpu_native.version = 29.0.1.1
wgpu_native.archive = https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-windows-x86_64-msvc-release.zip
wgpu_native.archive.sha256 = 7e67d7445c42aeb85e30f88930fd8d7d83ee769e3390aeb1ada75ebf3cf78132
wgpu_native.entry = lib/wgpu_native.dll

# The DirectX Shader Compiler (DXC), which wgpu-native compiles shaders with on Direct3D 12: the
# pipeline takes about 130 ms with it and nearly 600 ms with FXC, Windows' own compiler. The
# release archive is Microsoft's; its file names use backslashes, which the tool accepts for an
# entry written with /. wgpu-native loads only dxcompiler.dll from it, not dxil.dll. Its license
# is the LLVM Release License (NCSA), which the release notes name for every file of the archive
# but d3d12shader.h; the notices of the code it contains are DXC's ThirdPartyNotices.txt of the
# same tag, beside its full LICENSE.TXT (NCSA and the licenses of Miniz and the other code it
# contains) under licenses/.
dxcompiler.version = 1.9.2609
dxcompiler.archive = https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip
dxcompiler.archive.sha256 = ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1
dxcompiler.entry = bin/x64/dxcompiler.dll

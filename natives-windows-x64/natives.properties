# The native libraries this module packages, pinned by version and by the SHA-256 of the release
# archive they come from.
#
# scripts/FetchNatives.java reads this file. It downloads each archive into fetched/archives/,
# checks its SHA-256, unpacks the library into
# fetched/resources/META-INF/rethinkj-ui/natives/<platform>/ and writes manifest.txt beside it.
# The module's build runs it, and it downloads nothing while fetched/ matches this file.
#
# To change a version, edit the library's lines, build, and update the licence texts under
# src/main/resources if the release changed them.

platform = windows-x64

# Load order: a library comes after the libraries it needs.
libraries = sdl3 wgpu_native

sdl3.version = 3.4.20
sdl3.archive = https://github.com/libsdl-org/SDL/releases/download/release-3.4.20/SDL3-3.4.20-win32-x64.zip
sdl3.archive.sha256 = 368bed8b24e44ad9ea372990814f2343fcfb9e468abb7f8f4a3bc146c7304752
# The library's path inside the archive; the module packages it under its file name.
sdl3.entry = SDL3.dll

wgpu_native.version = 29.0.1.1
wgpu_native.archive = https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-windows-x86_64-msvc-release.zip
wgpu_native.archive.sha256 = 7e67d7445c42aeb85e30f88930fd8d7d83ee769e3390aeb1ada75ebf3cf78132
wgpu_native.entry = lib/wgpu_native.dll

# The native libraries this module packages, pinned by version and by the SHA-256 of the archive
# they come from. SDL and wgpu-native come from their release archives. FreeType and HarfBuzz are
# built from the source archives that natives-linux-x64 builds, with its options, so that text has
# the same features on both platforms.
#
# scripts/FetchNatives.java reads this file. It downloads each archive into fetched/archives/ and
# checks its SHA-256. It builds a library that has a .cmake line in fetched/builds/<name>/, once,
# and unpacks the others. It puts the libraries into
# fetched/resources/META-INF/rethinkj-ui/natives/<platform>/ and writes manifest.txt beside them.
# The module's build runs it, and it does nothing while fetched/ matches this file.
#
# Building needs Visual Studio 2022 or later, or its Build Tools, with the workload "Desktop
# development with C++" and its component "C++ CMake tools for Windows". The tool finds them with
# vswhere.exe and needs nothing on the PATH. Instead of that component, cmake may come from the
# PATH or from the file that the environment variable CMAKE names, such as bin\cmake.exe of the
# Windows ZIP from cmake.org, unpacked anywhere. The class WindowsTools in the tool has the
# details.
#
# To change a version, edit the library's lines, build, and update the licence texts under
# src/main/resources if the release changed them.

platform = windows-x64

# Load order: a library comes after the libraries it needs. Loading one loads those before it, so
# the text libraries come first: rendering without a window needs them, but not SDL or wgpu.
libraries = freetype harfbuzz sdl3 wgpu_native

# The archives of FreeType and HarfBuzz are those of natives-linux-x64, which says where they come
# from. Both libraries link the C runtime statically (/MT), so that they need nothing but
# KERNEL32.dll; VCRUNTIME140.dll comes with the Visual C++ Redistributable, not with Windows.
freetype.version = 2.15.0
freetype.archive = https://download.savannah.gnu.org/releases/freetype/freetype-2.15.0.tar.xz
freetype.archive.sha256 = 93cd47eb719c325107f2d3cf087d06299e944c3b48a40b55537302304dea1dd5
# The options of natives-linux-x64: FreeType's own copy of zlib, no bzip2, PNG, brotli or HarfBuzz,
# the auto-hinter and the TrueType bytecode interpreter in. A Release build, whose DLL has no d
# suffix.
freetype.cmake = -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DFT_DISABLE_ZLIB=ON \
    -DFT_DISABLE_BZIP2=ON -DFT_DISABLE_PNG=ON -DFT_DISABLE_BROTLI=ON -DFT_DISABLE_HARFBUZZ=ON \
    -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
# The library's path in the build folder, or inside the release archive; the module packages it
# under its file name.
freetype.entry = freetype.dll

harfbuzz.version = 15.1.0
harfbuzz.archive = https://github.com/harfbuzz/harfbuzz/releases/download/15.1.0/harfbuzz-15.1.0.tar.xz
harfbuzz.archive.sha256 = 0fc7c565443a5f4be7da65ac5ee5bd737d9b158dc908708b7689a0a5796b0c8d
# The options of natives-linux-x64, and without Windows' own shaping and font APIs (Uniscribe, GDI,
# DirectWrite), which are off by default too. HarfBuzz asks for CMake 3.14, which leaves the policy
# CMP0091 OLD, and then CMAKE_MSVC_RUNTIME_LIBRARY has no effect; so the policy is set NEW here.
# FreeType's CMake range makes it NEW by itself.
harfbuzz.cmake = -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DHB_HAVE_FREETYPE=OFF \
    -DHB_HAVE_GLIB=OFF -DHB_HAVE_ICU=OFF -DHB_HAVE_GRAPHITE2=OFF -DHB_HAVE_CAIRO=OFF \
    -DHB_HAVE_GOBJECT=OFF -DHB_HAVE_INTROSPECTION=OFF -DHB_BUILD_UTILS=OFF -DHB_BUILD_SUBSET=OFF \
    -DHB_BUILD_RASTER=OFF -DHB_BUILD_VECTOR=OFF -DHB_BUILD_GPU=OFF -DHB_HAVE_UNISCRIBE=OFF \
    -DHB_HAVE_GDI=OFF -DHB_HAVE_DIRECTWRITE=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
    -DCMAKE_POLICY_DEFAULT_CMP0091=NEW
harfbuzz.entry = harfbuzz.dll

sdl3.version = 3.4.20
sdl3.archive = https://github.com/libsdl-org/SDL/releases/download/release-3.4.20/SDL3-3.4.20-win32-x64.zip
sdl3.archive.sha256 = 368bed8b24e44ad9ea372990814f2343fcfb9e468abb7f8f4a3bc146c7304752
sdl3.entry = SDL3.dll

wgpu_native.version = 29.0.1.1
wgpu_native.archive = https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-windows-x86_64-msvc-release.zip
wgpu_native.archive.sha256 = 7e67d7445c42aeb85e30f88930fd8d7d83ee769e3390aeb1ada75ebf3cf78132
wgpu_native.entry = lib/wgpu_native.dll
